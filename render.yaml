databases:
  - name: travelcam-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: travelcam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: travelcam-db
          property: connectionString
